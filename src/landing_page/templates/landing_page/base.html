{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{% static 'landing_page/images/favicon.png' %}" type="image/x-icon">
    <link rel="stylesheet" href="{% static 'landing_page/css/site.css' %}">
    <title>{% block title %}{{ CLUB_NAME }}{% endblock %}</title>
</head>
<body>
    {% include 'partials/navbar.html' %}
    <main class="container">
        {% for message in messages %}
            <p class="alert">{{ message }}</p>
        {% endfor %}
        {% block content %}{% endblock content %}
    </main>
    <footer class="footer">
        <div class="container">
            {{ CLUB_NAME }} &middot; {{ CLUB_SCHOOL }} &middot;
            <a href="mailto:{{ CLUB_EMAIL }}">{{ CLUB_EMAIL }}</a>
        </div>
    </footer>
</body>
</html>
