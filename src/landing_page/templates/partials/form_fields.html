{% if form.non_field_errors %}<div class="alert error" role="alert"><svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg><div>{{ form.non_field_errors }}</div></div>{% endif %}
{% for field in form %}
    <div class="field{% if field.errors %} has-error{% endif %}">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}<div class="help helptext" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
        {% for error in field.errors %}<p class="error" role="alert">{{ error }}</p>{% endfor %}
    </div>
{% endfor %}
