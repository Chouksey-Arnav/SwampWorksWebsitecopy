[project]
name = "swamp-works"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0.14",
    "dj-database-url==2.3.0",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.0.1",
    "whitenoise==6.9.0",
]

[tool.vercel]
entrypoint = "swamp_works.wsgi:application"

[tool.vercel.scripts]
build = "python manage.py migrate --noinput"
